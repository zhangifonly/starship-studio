name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:timeline
      - run: npm run test:capture
      - run: npm run test:grid-fins
      - run: npm run test:deployment
      - run: npm run test:geo
      - run: npm run test:ship30
      - run: npm run test:ascent
      - run: npm run test:staging
      - run: npm run test:steam
      - run: npm run build
